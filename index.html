<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ゴスペル・ハーモニーじゃんけん</title>
  <style>
    :root {
      --bg: #080808;
      --panel: rgba(20, 18, 14, 0.84);
      --gold: #d8aa43;
      --gold-bright: #ffe08a;
      --ivory: #fff7df;
      --muted: #b7a986;
      --red: #d85656;
      --green: #71d88d;
      --line: rgba(216, 170, 67, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ivory);
      font-family: "Trebuchet MS", "Hiragino Sans", "Yu Gothic", sans-serif;
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 224, 138, 0.22), transparent 26rem),
        radial-gradient(circle at 20% 85%, rgba(120, 52, 22, 0.24), transparent 22rem),
        linear-gradient(145deg, #020202 0%, #14100b 52%, #050505 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(100deg, transparent 0 16%, rgba(255, 220, 130, 0.08) 17%, transparent 24%),
        linear-gradient(82deg, transparent 0 68%, rgba(255, 220, 130, 0.07) 69%, transparent 78%);
      mix-blend-mode: screen;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      place-items: center;
      gap: 24px;
      padding: 36px 18px;
      position: relative;
    }

    .title {
      text-align: center;
      letter-spacing: 0;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4.8rem);
      color: var(--gold-bright);
      text-shadow: 0 0 18px rgba(216, 170, 67, 0.48), 0 4px 0 #000;
    }

    .title p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 2.4vw, 1.2rem);
    }

    .stage {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
      gap: 22px;
      padding: clamp(22px, 5vw, 44px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 224, 138, 0.08), transparent 38%),
        var(--panel);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.55), inset 0 0 60px rgba(216, 170, 67, 0.05);
      backdrop-filter: blur(8px);
    }

    .streak {
      width: min(420px, 100%);
      text-align: center;
      padding: 18px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .streak-label {
      display: block;
      color: var(--muted);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .streak-number {
      display: block;
      margin-top: 4px;
      font-size: clamp(4.2rem, 16vw, 8rem);
      line-height: 0.9;
      font-weight: 900;
      color: var(--gold-bright);
      text-shadow: 0 0 24px rgba(255, 224, 138, 0.42);
    }

    .choices {
      width: min(600px, 100%);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .choice-button {
      min-height: 118px;
      border: 1px solid rgba(255, 224, 138, 0.42);
      border-radius: 8px;
      color: var(--ivory);
      background: linear-gradient(180deg, #2b2415, #0c0b09);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .choice-button:hover,
    .choice-button:focus-visible {
      transform: translateY(-4px);
      border-color: var(--gold-bright);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.48), 0 0 24px rgba(216, 170, 67, 0.24);
      outline: none;
    }

    .choice-button:active {
      transform: translateY(0);
    }

    .hand-icon {
      display: block;
      font-size: clamp(2.4rem, 8vw, 4rem);
      line-height: 1;
    }

    .hand-label {
      display: block;
      margin-top: 10px;
      font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 800;
    }

    .result-panel {
      width: min(620px, 100%);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      color: var(--ivory);
    }

    .result-box {
      min-height: 84px;
      display: grid;
      align-content: center;
      gap: 6px;
      padding: 16px;
      border: 1px solid rgba(216, 170, 67, 0.24);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.32);
      text-align: center;
    }

    .result-box span:first-child {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .result-value {
      font-size: clamp(1.2rem, 4vw, 1.7rem);
      font-weight: 900;
    }

    .message {
      min-height: 38px;
      text-align: center;
      font-size: clamp(1.05rem, 3vw, 1.45rem);
      font-weight: 900;
      color: var(--gold-bright);
      text-shadow: 0 0 14px rgba(216, 170, 67, 0.45);
    }

    .message.win {
      color: var(--green);
    }

    .message.lose {
      color: var(--red);
    }

    .chorus-banner {
      position: fixed;
      inset: auto 16px 32px;
      margin: auto;
      width: min(620px, calc(100% - 32px));
      padding: 18px 22px;
      border: 1px solid rgba(255, 224, 138, 0.66);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(255, 224, 138, 0.96), rgba(202, 143, 42, 0.96));
      color: #160f05;
      text-align: center;
      font-size: clamp(1.3rem, 5vw, 2.2rem);
      font-weight: 1000;
      box-shadow: 0 0 46px rgba(255, 224, 138, 0.42);
      transform: translateY(150%);
      opacity: 0;
      transition: transform 320ms ease, opacity 320ms ease;
      z-index: 5;
    }

    .chorus-banner.show {
      transform: translateY(0);
      opacity: 1;
      animation: glowPulse 900ms ease-in-out infinite alternate;
    }

    .sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at 20% 28%, var(--gold-bright) 0 3px, transparent 4px),
        radial-gradient(circle at 72% 22%, var(--gold-bright) 0 2px, transparent 3px),
        radial-gradient(circle at 42% 62%, var(--gold) 0 3px, transparent 4px),
        radial-gradient(circle at 82% 70%, var(--gold-bright) 0 3px, transparent 4px),
        radial-gradient(circle at 12% 78%, var(--gold) 0 2px, transparent 3px);
      z-index: 4;
    }

    .sparkles.show {
      animation: sparkleBurst 1100ms ease-out;
    }

    footer {
      color: rgba(255, 247, 223, 0.58);
      font-size: 0.85rem;
      text-align: center;
    }

    @keyframes glowPulse {
      from {
        box-shadow: 0 0 32px rgba(255, 224, 138, 0.38);
      }
      to {
        box-shadow: 0 0 62px rgba(255, 224, 138, 0.72);
      }
    }

    @keyframes sparkleBurst {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: scale(1.18);
      }
    }

    @media (max-width: 580px) {
      .app {
        padding: 24px 12px;
      }

      .choices {
        gap: 10px;
      }

      .choice-button {
        min-height: 98px;
        padding: 10px 4px;
      }

      .result-panel {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="title">
      <h1>Gospel Harmony Janken</h1>
      <p>勝利のたびに声が重なり、3連勝で大コーラスが鳴り響きます。</p>
    </header>

    <section class="stage" aria-label="じゃんけんステージ">
      <div class="streak" aria-live="polite">
        <span class="streak-label">Current Winning Streak</span>
        <span id="streakCount" class="streak-number">0</span>
      </div>

      <div class="choices" aria-label="手を選ぶ">
        <button class="choice-button" type="button" data-hand="gu">
          <span class="hand-icon" aria-hidden="true">✊</span>
          <span class="hand-label">グー</span>
        </button>
        <button class="choice-button" type="button" data-hand="choki">
          <span class="hand-icon" aria-hidden="true">✌</span>
          <span class="hand-label">チョキ</span>
        </button>
        <button class="choice-button" type="button" data-hand="pa">
          <span class="hand-icon" aria-hidden="true">✋</span>
          <span class="hand-label">パー</span>
        </button>
      </div>

      <div class="result-panel">
        <div class="result-box">
          <span>CPUの手</span>
          <span id="cpuHand" class="result-value">-</span>
        </div>
        <div class="result-box">
          <span>勝敗</span>
          <span id="resultText" class="result-value">選んでください</span>
        </div>
      </div>

      <div id="message" class="message" aria-live="polite"></div>
    </section>

    <footer>音声ファイル: sound/sound_gu.mp3 / sound/sound_choki.mp3 / sound/sound_pa.mp3 / sound_chorus.mp3</footer>
  </main>

  <div id="sparkles" class="sparkles" aria-hidden="true"></div>
  <div id="chorusBanner" class="chorus-banner" role="status" aria-live="assertive">
    Harmony Complete!
  </div>

  <script>
    const hands = {
      gu: { label: "グー", sound: "sound/sound_gu.mp3", beats: "choki" },
      choki: { label: "チョキ", sound: "sound/sound_choki.mp3", beats: "pa" },
      pa: { label: "パー", sound: "sound/sound_pa.mp3", beats: "gu" }
    };

    const buttons = document.querySelectorAll(".choice-button");
    const streakCount = document.getElementById("streakCount");
    const cpuHand = document.getElementById("cpuHand");
    const resultText = document.getElementById("resultText");
    const message = document.getElementById("message");
    const chorusBanner = document.getElementById("chorusBanner");
    const sparkles = document.getElementById("sparkles");

    let streak = 0;
    let chorusTimer = null;

    function playSound(fileName) {
   // 1. 今の場所を基準にした正しいURLオブジェクトを強制的に作ります
    const audioUrl = new URL(fileName, window.location.href);
    const audio = new Audio(audioUrl.href);
  
   audio.currentTime = 0;
   audio.play().catch(() => {
    console.info(`${fileName} を再生できませんでした。`);
      });
    } 
  


    function getCpuHand() {
      const keys = Object.keys(hands);
      return keys[Math.floor(Math.random() * keys.length)];
    }

    function judge(player, cpu) {
      if (player === cpu) return "draw";
      return hands[player].beats === cpu ? "win" : "lose";
    }

    function updateResult(result) {
      message.className = "message";

      if (result === "win") {
        streak += 1;
        resultText.textContent = "勝ち";
        message.textContent = "Good harmony! 連勝が重なりました。";
        message.classList.add("win");
      } else if (result === "lose") {
        streak = 0;
        resultText.textContent = "負け";
        message.textContent = "コーラスは一度リセット。次の一声へ。";
        message.classList.add("lose");
      } else {
        resultText.textContent = "あいこ";
        message.textContent = "同じ音が響きました。連勝数はそのまま。";
      }

      streakCount.textContent = streak;

      if (streak > 0 && streak % 3 === 0) {
        triggerChorus();
      }
    }

    function triggerChorus() {
      playSound("sound/sound_chorus.mp3");
      chorusBanner.classList.add("show");
      sparkles.classList.remove("show");
      void sparkles.offsetWidth;
      sparkles.classList.add("show");

      clearTimeout(chorusTimer);
      chorusTimer = setTimeout(() => {
        chorusBanner.classList.remove("show");
      }, 2400);
    }

    function handleChoice(event) {
      const playerHand = event.currentTarget.dataset.hand;
      const cpu = getCpuHand();
      const result = judge(playerHand, cpu);

      playSound(hands[playerHand].sound);
      cpuHand.textContent = hands[cpu].label;
      updateResult(result);
    }

    buttons.forEach((button) => {
      button.addEventListener("click", handleChoice);
    });
  </script>
</body>
</html>
